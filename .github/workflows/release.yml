name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the tested Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.93.1

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Build the Windows executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Package the executable and checksum
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/pomodoro.exe -Destination dist/pomodoro-soundscapes-windows-x64.exe
          $digest = (Get-FileHash -LiteralPath dist/pomodoro-soundscapes-windows-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  pomodoro-soundscapes-windows-x64.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload the build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pomodoro-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          @'
          Pomodoro Soundscapes brings an egui desktop timer and an offline mixer with rain, thunder, rainforest, birds, ocean, pink noise, brown noise and alpha tones.

          This release includes centered timer controls, louder soundscapes, a new app icon and session settings that remain accessible beneath the clock.

          Download pomodoro-soundscapes-windows-x64.exe and open it on Windows. Audio is bundled in the executable. SHA256SUMS.txt contains the executable checksum.
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "Pomodoro Soundscapes $env:RELEASE_TAG" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG dist/pomodoro-soundscapes-windows-x64.exe dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
